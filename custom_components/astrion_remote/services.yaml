toast:
  fields:
    text:
      required: true
      example: "Dinner is ready"
      selector:
        text:
    device_id:
      required: false
      selector:
        device:
          multiple: true
          filter:
            integration: astrion_remote
page:
  fields:
    id:
      required: true
      example: "now"
      selector:
        text:
    device_id:
      required: false
      selector:
        device:
          multiple: true
          filter:
            integration: astrion_remote
reload:
  fields:
    device_id:
      required: false
      selector:
        device:
          multiple: true
          filter:
            integration: astrion_remote
reset_to_defaults:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: astrion_remote
    parts:
      required: false
      default:
        - pages
      selector:
        select:
          multiple: true
          options:
            - pages
            - keys
            - timings
            - theme
undo_reset:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: astrion_remote
